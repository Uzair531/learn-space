<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Started — LearnSpace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-obsidian text-white d-flex align-items-center justify-content-center vh-100 position-relative overflow-hidden">

  <!-- Ambient Background Orbs -->
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>

  <div class="container z-index-2 d-flex justify-content-center">
    <div class="glass-card-3d p-5 rounded-5 shadow-3d-deep w-100 position-relative" style="max-width: 460px;">
      
      <!-- Brand Header -->
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center mb-3">
          <svg width="48" height="48" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 20L80 35L50 50L20 35L50 20Z" fill="url(#paint0_linear)" />
            <path d="M20 55L50 70L80 55" stroke="url(#paint1_linear)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <ellipse cx="50" cy="50" rx="42" ry="16" transform="rotate(-25 50 50)" stroke="url(#paint2_linear)" stroke-width="4" stroke-dasharray="6 4"/>
            <circle cx="82" cy="35" r="5" fill="#00f0ff" />
            <defs>
              <linearGradient id="paint0_linear" x1="20" y1="20" x2="80" y2="50" gradientUnits="userSpaceOnUse">
                <stop stop-color="#00f0ff"/><stop offset="1" stop-color="#8b5cf6"/>
              </linearGradient>
              <linearGradient id="paint1_linear" x1="20" y1="55" x2="80" y2="70" gradientUnits="userSpaceOnUse">
                <stop stop-color="#00f0ff"/><stop offset="1" stop-color="#a855f7"/>
              </linearGradient>
              <linearGradient id="paint2_linear" x1="8" y1="50" x2="92" y2="50" gradientUnits="userSpaceOnUse">
                <stop stop-color="#00f0ff" stop-opacity="0.8"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0.3"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h3 class="fw-extrabold mb-1">Create Account</h3>
        <p class="text-muted small">Join 45,000+ elite students upgrading their future.</p>
      </div>

      <form>
        <div class="mb-3">
          <label class="form-label text-muted small fw-semibold">Full Name</label>
          <div class="position-relative">
            <i class="bi bi-person position-absolute top-50 start-0 translate-middle-y ms-3 text-cyan"></i>
            <input type="text" class="form-control bg-obsidian text-white border-glass ps-5 py-2.5 rounded-pill" placeholder="Alex Vance" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label text-muted small fw-semibold">Email Address</label>
          <div class="position-relative">
            <i class="bi bi-envelope position-absolute top-50 start-0 translate-middle-y ms-3 text-cyan"></i>
            <input type="email" class="form-control bg-obsidian text-white border-glass ps-5 py-2.5 rounded-pill" placeholder="name@example.com" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label text-muted small fw-semibold">Password</label>
          <div class="position-relative">
            <i class="bi bi-lock position-absolute top-50 start-0 translate-middle-y ms-3 text-cyan"></i>
            <input type="password" class="form-control bg-obsidian text-white border-glass ps-5 py-2.5 rounded-pill" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-luxury-glow w-100 py-3 rounded-pill mb-3 fw-bold shadow-3d">Get Started Free</button>
      </form>

      <div class="text-center mt-3">
        <a href="index.html" class="text-muted text-decoration-none small hover-cyan"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
