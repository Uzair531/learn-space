<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — LearnSpace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center vh-100">
  <div class="glass-card p-5 rounded-4 shadow-lg w-100" style="max-width: 420px;">
    <h3 class="fw-bold mb-4 text-center">Welcome Back</h3>
    <form>
      <div class="mb-3">
        <label class="form-label text-muted">Email Address</label>
        <input type="email" class="form-control bg-secondary bg-opacity-25 text-white border-secondary" placeholder="name@example.com" required>
      </div>
      <div class="mb-4">
        <label class="form-label text-muted">Password</label>
        <input type="password" class="form-control bg-secondary bg-opacity-25 text-white border-secondary" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill mb-3">Sign In</button>
    </form>
    <div class="text-center">
      <a href="index.html" class="text-muted text-decoration-none small"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
